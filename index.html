<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="和潤分期與 Skool 入群完整圖片教學">
  <title>和潤分期＋Skool 入群教學</title>
  <style>
    :root { color-scheme: light; --bg:#f7f4ef; --ink:#171717; --muted:#6b6762; --teal:#0e7c73; --gold:#f1c86b; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
    .top { padding:calc(26px + env(safe-area-inset-top)) 20px 20px; text-align:center; }
    .top h1 { margin:0; font-size:clamp(26px,7vw,42px); line-height:1.2; }
    .top p { margin:10px 0 0; color:var(--muted); font-size:16px; }
    .progress { position:sticky; top:0; z-index:10; display:flex; justify-content:center; gap:7px; padding:10px; background:rgba(247,244,239,.92); backdrop-filter:blur(10px); }
    .progress a { width:10px; height:10px; border-radius:50%; background:#cbc5bc; text-indent:-9999px; overflow:hidden; }
    .progress a:first-child { background:var(--teal); }
    main { width:min(100%, 760px); margin:0 auto; padding:0 12px 56px; }
    figure { margin:0 0 18px; scroll-margin-top:48px; }
    img { display:block; width:100%; height:auto; border-radius:18px; box-shadow:0 10px 28px rgba(35,29,22,.09); background:#fff; }
    .tip { margin:26px 6px 8px; padding:18px; border-radius:18px; background:var(--teal); color:#fff; text-align:center; font-weight:700; line-height:1.65; }
    footer { padding:22px 20px calc(30px + env(safe-area-inset-bottom)); color:var(--muted); text-align:center; font-size:14px; }
    @media (min-width:761px) { main { padding-left:0; padding-right:0; } figure { margin-bottom:28px; } img { border-radius:26px; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>和潤分期＋Skool 入群</h1>
    <p>依照圖片順序往下滑，即可完成全部步驟</p>
  </header>
  <nav class="progress" aria-label="步驟快速導覽">
    <a href="#step-1">1</a><a href="#step-2">2</a><a href="#step-3">3</a><a href="#step-4">4</a><a href="#step-5">5</a><a href="#step-6">6</a><a href="#step-7">7</a>
  </nav>
  <main>
    <figure id="step-1"><img src="01-flow-overview.png" alt="和潤分期與 Skool 入群流程總覽" width="1080" height="1350"></figure>
    <figure id="step-2"><img loading="lazy" src="02-form-sms-pay4u.png" alt="填表單、收到 Pay4U 簡訊並填寫資料" width="1080" height="1350"></figure>
    <figure id="step-3"><img loading="lazy" src="03-confirmation-call.png" alt="隔天接聽分期公司的確認電話" width="1080" height="1350"></figure>
    <figure id="step-4"><img loading="lazy" src="04-skool-account.png" alt="建立或登入 Skool 帳號" width="1080" height="1350"></figure>
    <figure id="step-5"><img loading="lazy" src="05-standard-questions.png" alt="選擇 Standard 免費方案並填寫入群問題" width="1080" height="1350"></figure>
    <figure id="step-6"><img loading="lazy" src="06-profile-pending.png" alt="完成個人資料並等待入群核准" width="1080" height="1350"></figure>
    <figure id="step-7"><img loading="lazy" src="07-email-approval.png" alt="回簽商品確認書並等待 Miranda 核准" width="1080" height="1350"></figure>
    <p class="tip">重要提醒：Skool 的 First name、Last name 一定要使用英文。</p>
  </main>
  <footer>Miranda's Massage School｜新手入群圖片教學</footer>
</body>
</html>
